name: Release

on:
  push:
    tags:
    - '*.*.*'
env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  MINVERBUILDMETADATA: build.${{ github.run_id }}.${{ github.run_attempt}}
permissions:
  id-token: write
  contents: write
  checks: write
jobs:
  build:
    strategy:
      matrix: 
        os: [windows-2025]
      fail-fast: false
    runs-on: windows-2025
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        filter: tree:0
    - name: Verify tag is on its release branch
      # A tag created from the GitHub Releases UI can land on the default branch instead of the selected one (AutoMapper#4620)
      run: |
        set -euo pipefail
        major="${GITHUB_REF_NAME#v}"
        major="${major%%.*}"
        status=0
        git ls-remote --exit-code --heads origin "release/${major}.x" > /dev/null || status=$?
        # Exit code 2 means no matching branch; anything else is a failed lookup
        if [ "$status" -eq 0 ]; then
          branch="release/${major}.x"
        elif [ "$status" -eq 2 ]; then
          branch="main"
        else
          echo "::error::Could not look up release/${major}.x (git ls-remote exit code ${status})"
          exit 1
        fi
        git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
        if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${branch}"; then
          echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on ${branch}. Delete the tag and recreate it on ${branch}."
          exit 1
        fi
        echo "Tag ${GITHUB_REF_NAME} is on ${branch}"
      shell: bash
    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        # 8.0.x: Runtime for NuGetKeyVaultSignTool and sbom-tool. Rolling sbom-tool forward produced incomplete SBOMs in AutoMapper#4681
        dotnet-version: |
          8.0.x
          10.0.x
          11.0.x
    - name: Install NuGetKeyVaultSignTool
      run: dotnet tool install --global NuGetKeyVaultSignTool
    - name: Build and Test
      run: ./Build.ps1
      shell: pwsh
    - name: Report Test Results
      uses: dorny/test-reporter@v1.9.1
      if: always()
      with:
        name: Test Results (Windows)
        path: '**/TestResults/**/*.trx'
        reporter: dotnet-trx
    - name: Get package version
      id: version
      shell: pwsh
      run: |
        $pkg = Get-ChildItem ./artifacts -Filter "MediatR.*.nupkg" | Select-Object -First 1
        $version = $pkg.BaseName -replace '^MediatR\.', ''
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
    - name: Generate SBOM
      shell: pwsh
      run: |
        dotnet tool install --global Microsoft.Sbom.DotNetTool
        sbom-tool generate `
          -b ./artifacts `
          -bc ./src/MediatR `
          -pn MediatR `
          -pv ${{ steps.version.outputs.version }} `
          -ps "Lucky Penny Software LLC" `
          -nsb https://mediatr.io
    - name: Sign packages
      run: |-
        foreach ($f in Get-ChildItem "./artifacts" -Filter "*.nupkg") {
          NuGetKeyVaultSignTool sign $f.FullName --file-digest sha256 --timestamp-rfc3161 http://timestamp.digicert.com --azure-key-vault-managed-identity --azure-key-vault-url ${{ secrets.AZURE_KEYVAULT_URI }} --azure-key-vault-certificate ${{ secrets.CODESIGN_CERT_NAME }}
        }
    - name: Push to MyGet
      env:
        NUGET_URL: https://f.feedz.io/lucky-penny-software/mediatr/nuget/index.json
        NUGET_API_KEY: ${{ secrets.FEEDZIO_ACCESS_TOKEN }}
      run: ./Push.ps1
      shell: pwsh
    - name: NuGet login
      # Exchanges the workflow's OIDC token for a temporary API key, valid for one hour.
      # Requires a trusted publishing policy on nuget.org for this repository and release.yml.
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push to NuGet
      env:
        NUGET_URL: https://api.nuget.org/v3/index.json
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: ./Push.ps1
      shell: pwsh
    - name: Attach assets to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $assets = @()
        $assets += Get-ChildItem ./artifacts -Filter *.nupkg | ForEach-Object { $_.FullName }
        $assets += Get-ChildItem ./artifacts -Filter *.snupkg | ForEach-Object { $_.FullName }
        $assets += './artifacts/_manifest/spdx_2.2/manifest.spdx.json'
        $assets += './artifacts/_manifest/spdx_2.2/manifest.spdx.json.sha256'
        gh release upload ${{ github.ref_name }} $assets --clobber
      shell: pwsh
    - name: Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifacts
        path: artifacts/**/*
